<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Atamura RPG - Mobitva Style</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* БАЗОВЫЕ СТИЛИ */
        body { margin: 0; background: #0d0d12; color: #fff; font-family: sans-serif; overflow: hidden; user-select: none; }
        
        /* СТАРТОВЫЙ ЭКРАН */
        #start-screen { position: absolute; width: 100%; height: 100%; background: #050508; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
        
        /* ВКЛАДКИ И НАВИГАЦИЯ */
        #main-ui { display: none; flex-direction: column; height: 100vh; }
        .navbar { display: flex; background: #0a0a0f; border-bottom: 1px solid #222; }
        .nav-btn { flex: 1; padding: 15px 0; text-align: center; color: #888; font-weight: bold; cursor: pointer; }
        .nav-btn.active { color: #ff9f43; border-bottom: 2px solid #ff9f43; background: rgba(255,159,67,0.1); }
        .screen { display: none; flex: 1; padding: 15px; overflow-y: auto; box-sizing: border-box; }
        .screen.active { display: block; }
        
        /* ЭЛЕМЕНТЫ ИНТЕРФЕЙСА */
        .card { background: #16161e; border: 1px solid #222; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; background: linear-gradient(135deg, #ff9f43, #d35400); color: #fff; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .btn:disabled { background: #333; color: #666; }
        
        /* АНИМАЦИЯ СПРАЙТОВ (Твои картинки) */
        .arena-container { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .char-box { width: 48%; text-align: center; }
        .avatar-box { width: 140px; height: 140px; margin: 0 auto; overflow: hidden; position: relative; }
        .sprite { width: 140px; height: 140px; background-repeat: no-repeat; image-rendering: pixelated; }
        
        /* Берем первые 4 кадра анимации Idle из твоих файлов */
        .hero-sprite { background-image: url('gladiator.png'); background-position: 0px -140px; animation: playIdle 0.8s steps(4) infinite; }
        .enemy-sprite { background-image: url('skeleton.png'); background-position: 0px -140px; animation: playIdle 0.8s steps(4) infinite; transform: scaleX(-1); }
        @keyframes playIdle { from { background-position-x: 0px; } to { background-position-x: -560px; } }
        
        /* Анимация ударов */
        .atk-hero { animation: lungeRight 0.3s ease; }
        .atk-enemy { animation: lungeLeft 0.3s ease; }
        .hurt { animation: shake 0.3s ease; filter: brightness(0.5) sepia(1) hue-rotate(-50deg) saturate(5); }
        @keyframes lungeRight { 50% { transform: translateX(30px); } }
        @keyframes lungeLeft { 50% { transform: translateX(-30px); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        
        /* ПОЛОСКИ ЗДОРОВЬЯ */
        .hp-bg { width: 100%; height: 8px; background: #222; border-radius: 4px; overflow: hidden; margin-top: 5px; }
        .hp-fill { height: 100%; transition: width 0.3s; }
        
        /* ЛОГ БОЯ */
        #log { height: 100px; background: #000; padding: 10px; overflow-y: auto; font-size: 12px; border: 1px solid #333; border-radius: 8px; margin-bottom: 15px; }
        
        /* ИНВЕНТАРЬ И МАГАЗИН (Система редкости) */
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .item { background: #111; border: 1px solid #333; border-radius: 8px; padding: 10px; text-align: center; }
        .rarity-common { color: #fff; }
        .rarity-rare { color: #00a8ff; }
        .rarity-epic { color: #a31aff; }
        .rarity-legend { color: #ff9f43; text-shadow: 0 0 5px rgba(255,159,67,0.5); }
    </style>
</head>
<body>
    <div id="start-screen">
        <h1 style="color: #ff9f43;">ХРОНИКИ АТАМУРЫ</h1>
        <p style="color: #aaa; font-size: 12px;">Нажмите кнопку для инициализации RPG движка</p>
        <button class="btn" style="width: 80%; margin-top: 20px;" onclick="initGame()">ВОЙТИ В ИГРУ</button>
    </div>

    <div id="main-ui">
        
        <div class="navbar">
            <div class="nav-btn active" onclick="switchTab('arena')">⚔️ Арена</div>
            <div class="nav-btn" onclick="switchTab('bag')">🎒 Сумка</div>
            <div class="nav-btn" onclick="switchTab('shop')">💰 Торговец</div>
        </div>

        <div id="arena" class="screen active">
            <div class="arena-container">
                <div class="char-box" id="hero-box">
                    <div style="font-weight: bold; color: #ff9f43;" id="hero-name">Гладиатор</div>
                    <div style="font-size: 11px; color:#aaa;" id="hero-stats">Ур. 1</div>
                    <div class="hp-bg"><div class="hp-fill" style="background:#2ecc71;" id="hero-hp"></div></div>
                    <div class="avatar-box"><div class="sprite hero-sprite"></div></div>
                </div>
                <div class="char-box" id="enemy-box">
                    <div style="font-weight: bold; color: #a31aff;" id="enemy-name">Скелет</div>
                    <div style="font-size: 11px; color:#aaa;">Враг</div>
                    <div class="hp-bg"><div class="hp-fill" style="background:#e74c3c;" id="enemy-hp"></div></div>
                    <div class="avatar-box"><div class="sprite enemy-sprite"></div></div>
                </div>
            </div>
            
            <div id="log"><div style="color:#ff9f43">⚔️ Битва началась!</div></div>
            <button class="btn" id="atk-btn" onclick="attackTurn()">АТАКОВАТЬ</button>
        </div>

        <div id="bag" class="screen">
            <div class="card">
                <h3 style="margin-top: 0;">Ваша Экипировка</h3>
                <p style="font-size: 12px; color: #aaa;">Бонус силы: <span id="bonus-dmg" style="color:#ff9f43">+0</span></p>
                <p style="font-size: 12px; color: #aaa;">Золото: 💰 <span class="gold-display">0</span></p>
                <div class="grid" id="inventory-grid"></div>
            </div>
            <button class="btn" style="background: #27ae60;" onclick="saveToBot()">💾 СОХРАНИТЬ В БАЗУ</button>
        </div>

        <div id="shop" class="screen">
            <div class="card">
                <h3 style="margin-top: 0;">Лавка Торговца</h3>
                <p style="font-size: 12px; color: #aaa;">Золото: 💰 <span class="gold-display">0</span></p>
                <div class="grid">
                    <div class="item">
                        <div class="rarity-common" style="font-weight:bold;font-size:12px;">Эликсир Жизни</div>
                        <div style="font-size:10px;color:#888;margin:5px 0;">+50 HP</div>
                        <button class="btn" style="padding:8px;font-size:12px;" onclick="buyItem('potion')">15 💰</button>
                    </div>
                    <div class="item">
                        <div class="rarity-epic" style="font-weight:bold;font-size:12px;">Меч Титана</div>
                        <div style="font-size:10px;color:#888;margin:5px 0;">Урон +12</div>
                        <button class="btn" style="padding:8px;font-size:12px;" onclick="buyItem('sword')">100 💰</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let player = { name: "Гладиатор", hp: 100, maxHp: 100, baseDmg: 15, lvl: 1, gold: 0, inventory: [] };
        let enemy = { name: "Скелет-Страж", hp: 80, maxHp: 80, dmg: 10 };
        
        // Таблица лута с шансами (Gacha система)
        const lootTable = [
            { name: "Ржавый кинжал", rarity: "common", bonus: 2, chance: 50 },
            { name: "Кольчуга", rarity: "rare", bonus: 6, chance: 30 },
            { name: "Топор Палача", rarity: "epic", bonus: 15, chance: 15 },
            { name: "КЛИНОК БОГОВ", rarity: "legend", bonus: 40, chance: 5 }
        ];

        function initGame() {
            if (tg.initDataUnsafe?.user?.first_name) player.name = tg.initDataUnsafe.user.first_name;
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('main-ui').style.display = 'flex';
            updateUI();
        }

        function switchTab(tabId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
            updateUI();
        }

        function getTotalDmg() {
            return player.baseDmg + player.inventory.reduce((s, i) => s + i.bonus, 0);
        }

        function attackTurn() {
            let btn = document.getElementById('atk-btn');
            if(btn.disabled) return;
            btn.disabled = true;

            let hBox = document.getElementById('hero-box');
            let eBox = document.getElementById('enemy-box');
            hBox.classList.remove('atk-hero','hurt'); eBox.classList.remove('atk-enemy','hurt');
            void hBox.offsetWidth; void eBox.offsetWidth;

            // Ход игрока
            hBox.classList.add('atk-hero');
            setTimeout(() => {
                let dmg = getTotalDmg() + Math.floor(Math.random() * 5);
                enemy.hp -= dmg;
                eBox.classList.add('hurt');
                logMsg(`💥 Вы ударили на ${dmg} урона.`, '#2ecc71');
                updateUI();

                if(enemy.hp <= 0) return winMatch();

                // Ответ врага
                setTimeout(() => {
                    eBox.classList.remove('hurt');
                    eBox.classList.add('atk-enemy');
                    setTimeout(() => {
                        let eDmg = enemy.dmg + Math.floor(Math.random() * 3);
                        player.hp -= eDmg;
                        hBox.classList.add('hurt');
                        logMsg(`💀 Скелет нанес ${eDmg} урона.`, '#e74c3c');
                        updateUI();
                        
                        if(player.hp <= 0) {
                            logMsg(`☠️ ВЫ ПОГИБЛИ.`, '#e74c3c');
                            player.hp = player.maxHp;
                        }
                        btn.disabled = false;
                    }, 150);
                }, 500);
            }, 150);
        }

        function rollLoot() {
            let r = Math.random() * 100, cur = 0;
            for(let item of lootTable) {
                cur += item.chance;
                if(r <= cur) return item;
            }
            return null;
        }

        function winMatch() {
            let gold = 20 * player.lvl;
            player.gold += gold;
            logMsg(`🏆 ПОБЕДА! Найдено ${gold} 💰.`, '#f1c40f');
            
            // Шанс 40% на выпадение предмета
            if(Math.random() < 0.4) {
                let item = rollLoot();
                player.inventory.push(item);
                let color = item.rarity === 'legend' ? '#ff9f43' : (item.rarity === 'epic' ? '#a31aff' : (item.rarity === 'rare' ? '#00a8ff' : '#fff'));
                logMsg(`🎁 ВЫПАЛ ЛУТ: <span style="color:${color}">${item.name} (+${item.bonus} к силе)</span>!`, color);
            }

            player.lvl++;
            enemy.maxHp += 15; enemy.hp = enemy.maxHp; enemy.dmg += 2;
            document.getElementById('atk-btn').disabled = false;
            updateUI();
        }

        function buyItem(id) {
            if(id === 'potion' && player.gold >= 15) {
                player.gold -= 15; player.hp = Math.min(player.maxHp, player.hp + 50);
                tg.showAlert("Вы выпили эликсир!");
            } else if(id === 'sword' && player.gold >= 100) {
                player.gold -= 100; player.inventory.push({name: "Меч Титана", rarity: "epic", bonus: 12});
                tg.showAlert("Меч добавлен в инвентарь!");
            } else {
                tg.showAlert("Недостаточно золота!");
            }
            updateUI();
        }

        function updateUI() {
            document.getElementById('hero-name').innerText = player.name;
            document.getElementById('hero-stats').innerText = `Ур. ${player.lvl}`;
            document.getElementById('hero-hp').style.width = `${Math.max(0, (player.hp/player.maxHp)*100)}%`;
            document.getElementById('enemy-hp').style.width = `${Math.max(0, (enemy.hp/enemy.maxHp)*100)}%`;
            
            document.querySelectorAll('.gold-display').forEach(el => el.innerText = player.gold);
            document.getElementById('bonus-dmg').innerText = `+${player.inventory.reduce((s,i)=>s+i.bonus,0)}`;
            
            let bag = document.getElementById('inventory-grid');
            bag.innerHTML = player.inventory.length ? '' : '<div style="color:#555;grid-column:span 2;">Пусто</div>';
            player.inventory.forEach(i => {
                bag.innerHTML += `<div class="item"><div class="rarity-${i.rarity}" style="font-weight:bold;font-size:12px;">${i.name}</div><div style="font-size:10px;color:#888;">+${i.bonus} к силе</div></div>`;
            });
        }

        function logMsg(txt, col) {
            let log = document.getElementById('log');
            log.innerHTML += `<div style="color:${col};margin-bottom:4px;">${txt}</div>`;
            log.scrollTop = log.scrollHeight;
        }

        // ОТПРАВКА ДАННЫХ В PYTHON БОТ
        function saveToBot() {
            tg.sendData(JSON.stringify({ action: "save_loot", gold: player.gold, inventory: player.inventory, lvl: player.lvl }));
            tg.showAlert("Данные успешно отправлены в Telegram-бот!");
        }
    </script>
</body>
</html>
