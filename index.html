<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Хроники Атамуры</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary: #00ffcc;
            --danger: #ff3366;
            --bg: #050508;
            --panel: rgba(15, 15, 20, 0.85);
        }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg); color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden; user-select: none; -webkit-user-select: none;
        }

        #game-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 55vh; z-index: 1; }

        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2;
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
        }

        /* Статусы сверху */
        .top-hud { display: flex; justify-content: space-between; padding: 12px; }
        .glass-box {
            background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 10px; width: 45%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); pointer-events: auto;
        }
        .char-name { font-weight: 800; font-size: 13px; text-transform: uppercase; margin-bottom: 4px; }
        .hero-text { color: var(--primary); text-shadow: 0 0 5px rgba(0,255,204,0.5); }
        .enemy-text { color: var(--danger); text-shadow: 0 0 5px rgba(255,51,102,0.5); }
        .stats { font-size: 11px; color: #aaa; }
        
        .hp-track { width: 100%; height: 6px; background: rgba(0,0,0,0.5); border-radius: 3px; margin-top: 6px; overflow: hidden; }
        .hp-fill { height: 100%; transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .hero-hp { background: linear-gradient(90deg, #00ffcc, #0088ff); }
        .enemy-hp { background: linear-gradient(90deg, #ff3366, #ff8800); }

        /* Сюжет и Лог */
        .story-banner {
            margin: 0 12px; padding: 10px; background: rgba(0, 255, 204, 0.05);
            border: 1px solid rgba(0, 255, 204, 0.2); border-radius: 8px;
            font-size: 12px; color: #fff; text-align: center; font-style: italic; pointer-events: auto;
        }
        
        #log-container {
            height: 12vh; background: rgba(0,0,0,0.7); border-top: 1px solid #1a1a1a;
            padding: 10px; overflow-y: auto; font-size: 13px; pointer-events: auto;
        }

        /* Панель управления */
        .control-deck {
            background: rgba(10, 10, 12, 0.95); padding: 15px; border-radius: 20px 20px 0 0;
            border-top: 1px solid rgba(255,255,255,0.1); pointer-events: auto; box-sizing: border-box;
        }
        .zones { display: flex; gap: 10px; margin-bottom: 12px; }
        .zone-col { flex: 1; display: flex; flex-direction: column; gap: 6px; }
        .zone-title { color: #888; font-size: 10px; text-align: center; font-weight: bold; letter-spacing: 1px; }

        .btn-zone {
            background: #111; border: 1px solid #333; color: #888; padding: 12px;
            border-radius: 8px; text-align: center; font-size: 13px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .btn-zone.active-atk { background: rgba(0,255,204,0.15); border-color: var(--primary); color: var(--primary); }
        .btn-zone.active-def { background: rgba(0,136,255,0.15); border-color: #0088ff; color: #0088ff; }
        
        .action-btn {
            width: 100%; padding: 16px; border-radius: 12px; border: none;
            background: linear-gradient(135deg, var(--primary), #0088ff); color: #000;
            font-size: 16px; font-weight: 900; text-transform: uppercase; cursor: pointer; box-shadow: 0 4px 15px rgba(0,255,204,0.3);
        }
        .action-btn:disabled { background: #333; color: #666; box-shadow: none; cursor: not-allowed; }

        /* Экран загрузки / Старта */
        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); z-index: 10; display: flex; flex-direction: column;
            justify-content: center; align-items: center; pointer-events: auto;
        }
    </style>
</head>
<body>

    <canvas id="game-canvas"></canvas>

    <div id="ui-layer" style="display: none;">
        <div class="top-hud">
            <div class="glass-box">
                <div class="char-name hero-text" id="ui-hero-name">Герой</div>
                <div class="stats" id="ui-hero-stats">Ур. 1 | HP: 100</div>
                <div class="hp-track"><div class="hp-fill hero-hp" id="ui-hero-hp"></div></div>
            </div>
            <div class="glass-box" style="text-align: right;">
                <div class="char-name enemy-text" id="ui-enemy-name">Босс</div>
                <div class="stats" id="ui-enemy-stats">HP: 100</div>
                <div class="hp-track"><div class="hp-fill enemy-hp" id="ui-enemy-hp" style="float: right;"></div></div>
            </div>
        </div>

        <div class="story-banner" id="ui-story">Сюжет загружается...</div>

        <div id="log-container"></div>

        <div class="control-deck">
            <div class="zones">
                <div class="zone-col">
                    <div class="zone-title">ОРУЖИЕ (АТАКА)</div>
                    <div class="btn-zone active-atk" onclick="setZone('atk', 'head', this)">Голова</div>
                    <div class="btn-zone" onclick="setZone('atk', 'body', this)">Корпус</div>
                    <div class="btn-zone" onclick="setZone('atk', 'legs', this)">Ноги</div>
                </div>
                <div class="zone-col">
                    <div class="zone-title">ЩИТ (ЗАЩИТА)</div>
                    <div class="btn-zone active-def" onclick="setZone('def', 'head', this)">Голова</div>
                    <div class="btn-zone" onclick="setZone('def', 'body', this)">Корпус</div>
                    <div class="btn-zone" onclick="setZone('def', 'legs', this)">Ноги</div>
                </div>
            </div>
            <button class="action-btn" id="btn-fight" onclick="executeTurn()">АТАКОВАТЬ</button>
        </div>
    </div>

    <div id="start-screen">
        <h1 style="color: #00ffcc; margin-bottom: 10px; text-align: center;">ХРОНИКИ АТАМУРЫ</h1>
        <p style="color: #aaa; font-size: 14px; text-align: center; padding: 0 20px;">Нажмите кнопку ниже, чтобы запустить игровой движок и синхронизировать данные.</p>
        <button class="action-btn" style="width: 80%; margin-top: 20px;" onclick="initGame()">ВОЙТИ В БАШНЮ</button>
    </div>

    <script>
        // --- БАЗОВЫЕ НАСТРОЙКИ ---
        const tg = window.Telegram.WebApp;
        tg.expand();

        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let isProcessing = false;
        let currentAtk = 'head', currentDef = 'head';
        
        // --- ДАННЫЕ ИГРЫ ---
        let player = { name: "Сотрудник", hp: 120, maxHp: 120, dmg: 15, lvl: 1, exp: 0, chapter: 0 };
        let enemy = { name: "", hp: 100, maxHp: 100, dmg: 10 };

        const chapters = [
            { title: "Глава 1: Котлован Хаоса", boss: "Голем Котлована", type: "golem", hpMult: 1, dmgMult: 1, desc: "Строительная площадка захвачена. Огромный Голем из бетона и арматуры преграждает путь." },
            { title: "Глава 2: Забытый Архив", boss: "Призрак Реестра", type: "ghost", hpMult: 1.5, dmgMult: 1.5, desc: "В бумагах завелась темная магия. Бесплотный дух питается непроверенными договорами." },
            { title: "Глава 3: Финансовая Бездна", boss: "Теневой Аудитор", type: "auditor", hpMult: 2.2, dmgMult: 2, desc: "Хранитель золота Атамуры. Он не прощает ошибок в расчетах." }
        ];

        // --- ДВИЖОК ГРАФИКИ ---
        let entities = {};
        let particles = [];
        let gridOffset = 0; // Для анимации 3D пола

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight * 0.55;
        }
        window.addEventListener('resize', resize);
        resize();

        function initGame() {
            if (tg.initDataUnsafe?.user?.first_name) {
                player.name = tg.initDataUnsafe.user.first_name;
            }
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('ui-layer').style.display = 'flex';
            
            loadChapter();
            requestAnimationFrame(renderLoop);
        }

        function loadChapter() {
            if (player.chapter >= chapters.length) player.chapter = 0; // Цикл игры
            const ch = chapters[player.chapter];
            
            enemy.name = ch.boss;
            enemy.maxHp = Math.floor(80 * ch.hpMult) + (player.lvl * 10);
            enemy.hp = enemy.maxHp;
            enemy.dmg = Math.floor(10 * ch.dmgMult) + (player.lvl * 2);
            
            // Настройка сущностей для рендера
            entities.hero = { x: width * 0.25, y: height * 0.6, targetX: width * 0.25, color: '#00ffcc', type: 'hero', state: 'idle' };
            entities.enemy = { x: width * 0.75, y: height * 0.6, targetX: width * 0.75, color: '#ff3366', type: ch.type, state: 'idle' };

            document.getElementById('ui-story').innerText = ch.desc;
            log(`⚔️ <b>${ch.title}</b> началась!`, '#fff');
            updateUI();
        }

        // --- ОТРИСОВКА ---
        function drawGrid() {
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.1)';
            ctx.lineWidth = 1;
            gridOffset = (gridOffset + 1) % 40;
            
            // Горизонтальные линии (эффект движения вперед)
            for(let y = height * 0.4; y < height; y += 40) {
                let actualY = y + (gridOffset * ((y - height*0.4) / height));
                ctx.beginPath(); ctx.moveTo(0, actualY); ctx.lineTo(width, actualY); ctx.stroke();
            }
            // Вертикальные линии перспективы
            for(let x = -width; x < width * 2; x += 60) {
                ctx.beginPath(); ctx.moveTo(width/2, height*0.4); ctx.lineTo(x, height); ctx.stroke();
            }
        }

        function drawCharacter(ent) {
            ctx.save();
            ctx.translate(ent.x, ent.y);
            
            // Дыхание
            let bob = (ent.state === 'idle') ? Math.sin(Date.now() * 0.005) * 5 : (Math.random() * 10 - 5);
            ctx.translate(0, bob);

            ctx.shadowBlur = 15;
            ctx.shadowColor = ent.color;
            ctx.fillStyle = ent.color;
            ctx.strokeStyle = '#fff';

            if (ent.type === 'hero') {
                // Кибер-Рыцарь (Игрок)
                ctx.beginPath(); ctx.moveTo(-15, 40); ctx.lineTo(0, -10); ctx.lineTo(15, 40); ctx.fill(); // Плащ
                ctx.beginPath(); ctx.arc(0, -25, 12, 0, Math.PI*2); ctx.fill(); // Голова
                ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(30, -30); ctx.stroke(); // Меч
            } 
            else if (ent.type === 'golem') {
                ctx.fillRect(-30, -40, 60, 80); // Квадратный голем
                ctx.fillStyle = '#000'; ctx.fillRect(-15, -20, 10, 10); ctx.fillRect(5, -20, 10, 10); // Глаза
            }
            else if (ent.type === 'ghost') {
                ctx.beginPath(); ctx.moveTo(-20, 40); ctx.lineTo(0, -40); ctx.lineTo(20, 40); ctx.fill(); // Треугольный призрак
                ctx.beginPath(); ctx.arc(0, 10, 8, 0, Math.PI*2); ctx.fillStyle='#000'; ctx.fill();
            }
            else if (ent.type === 'auditor') {
                ctx.beginPath(); ctx.arc(0, 0, 35, 0, Math.PI*2); ctx.fill(); // Круглый босс
                ctx.fillStyle = '#000'; ctx.beginPath(); ctx.moveTo(-20, -10); ctx.lineTo(20, -10); ctx.lineTo(0, 20); ctx.fill(); // Глаз
            }

            ctx.restore();
        }

        function spawnParticles(x, y, color) {
            for(let i=0; i<20; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 15, vy: (Math.random() - 0.5) * 15,
                    life: 1.0, color: color
                });
            }
        }

        function renderLoop() {
            ctx.fillStyle = 'rgba(5, 5, 8, 0.4)'; // Motion blur
            ctx.fillRect(0, 0, width, height);

            drawGrid();

            // Анимация перемещения
            entities.hero.x += (entities.hero.targetX - entities.hero.x) * 0.2;
            entities.enemy.x += (entities.enemy.targetX - entities.enemy.x) * 0.2;

            drawCharacter(entities.hero);
            drawCharacter(entities.enemy);

            // Отрисовка частиц
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy; p.life -= 0.03;
                if (p.life <= 0) { particles.splice(i, 1); continue; }
                
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI*2); ctx.fill();
                ctx.globalAlpha = 1.0;
            }

            requestAnimationFrame(renderLoop);
        }

        // --- МЕХАНИКА БОЯ ---
        function setZone(type, val, btnEl) {
            if (isProcessing) return;
            const parent = btnEl.parentElement;
            parent.querySelectorAll('.btn-zone').forEach(b => b.classList.remove('active-atk', 'active-def'));
            
            if (type === 'atk') { currentAtk = val; btnEl.classList.add('active-atk'); } 
            else { currentDef = val; btnEl.classList.add('active-def'); }
        }

        const zName = { head: "Голову", body: "Корпус", legs: "Ноги" };

        function executeTurn() {
            if (isProcessing) return;
            isProcessing = true;
            document.getElementById('btn-fight').disabled = true;

            const zones = ['head', 'body', 'legs'];
            const eAtk = zones[Math.floor(Math.random() * 3)];
            const eDef = zones[Math.floor(Math.random() * 3)];

            // 1. УДАР ИГРОКА
            entities.hero.targetX = width * 0.45; // Рывок вперед
            
            setTimeout(() => {
                if (currentAtk === eDef) {
                    log(`🛡️ ${enemy.name} заблокировал удар в ${zName[currentAtk]}!`, '#ff3366');
                    spawnParticles(entities.enemy.x, entities.enemy.y, '#ffffff');
                } else {
                    let d = player.dmg + Math.floor(Math.random() * 5);
                    enemy.hp -= d;
                    log(`💥 Вы пробили ${zName[currentAtk]}! Нанесено ${d} урона.`, '#00ffcc');
                    entities.enemy.state = 'hurt';
                    spawnParticles(entities.enemy.x, entities.enemy.y, '#ff3366');
                    setTimeout(() => entities.enemy.state = 'idle', 300);
                }
                
                entities.hero.targetX = width * 0.25; // Отскок назад
                updateUI();

                if (enemy.hp <= 0) return win();

                // 2. ОТВЕТ ВРАГА
                setTimeout(() => {
                    entities.enemy.targetX = width * 0.55; // Рывок врага
                    
                    setTimeout(() => {
                        if (eAtk === currentDef) {
                            log(`🛡️ Вы отразили атаку врага в ${zName[eAtk]}!`, '#00ffcc');
                            spawnParticles(entities.hero.x, entities.hero.y, '#ffffff');
                        } else {
                            let ed = enemy.dmg + Math.floor(Math.random() * 4);
                            player.hp -= ed;
                            log(`🩸 ${enemy.name} нанес ${ed} урона в ${zName[eAtk]}.`, '#ff3366');
                            entities.hero.state = 'hurt';
                            spawnParticles(entities.hero.x, entities.hero.y, '#00ffcc');
                            setTimeout(() => entities.hero.state = 'idle', 300);
                        }

                        entities.enemy.targetX = width * 0.75;
                        updateUI();

                        if (player.hp <= 0) return lose();

                        isProcessing = false;
                        document.getElementById('btn-fight').disabled = false;
                    }, 150);
                }, 500);
            }, 150);
        }

        function win() {
            log(`🏆 <b>ПОБЕДА!</b> ${enemy.name} разрушен.`, '#ffd700');
            player.exp += 50;
            player.chapter++;
            
            if (player.exp >= 100) {
                player.lvl++; player.exp = 0; player.maxHp += 15; player.dmg += 4;
                log(`⭐ НОВЫЙ УРОВЕНЬ! Теперь вы ${player.lvl} уровня.`, '#00ffcc');
            }
            
            endState("СЛЕДУЮЩАЯ ГЛАВА", loadChapter);
        }

        function lose() {
            log(`💀 <b>ВЫ ПОГИБЛИ.</b> Тьма поглощает вас...`, '#ff3366');
            player.hp = player.maxHp;
            endState("ВОЗРОДИТЬСЯ", loadChapter);
        }

        function endState(btnText, callback) {
            let btn = document.getElementById('btn-fight');
            btn.disabled = false;
            btn.innerText = btnText;
            btn.onclick = () => {
                player.hp = player.maxHp;
                btn.innerText = "АТАКОВАТЬ";
                btn.onclick = executeTurn;
                isProcessing = false;
                callback();
            };
        }

        function updateUI() {
            document.getElementById('ui-hero-name').innerText = player.name;
            document.getElementById('ui-hero-stats').innerText = `Ур. ${player.lvl} | HP: ${Math.max(0, player.hp)}/${player.maxHp}`;
            document.getElementById('ui-hero-hp').style.width = `${(player.hp / player.maxHp) * 100}%`;

            document.getElementById('ui-enemy-name').innerText = enemy.name;
            document.getElementById('ui-enemy-stats').innerText = `HP: ${Math.max(0, enemy.hp)}/${enemy.maxHp}`;
            document.getElementById('ui-enemy-hp').style.width = `${(enemy.hp / enemy.maxHp) * 100}%`;
        }

        function log(text, color) {
            let box = document.getElementById('log-container');
            box.innerHTML += `<div style="color: ${color}; margin-bottom: 5px; line-height: 1.4;">${text}</div>`;
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
  </html>
